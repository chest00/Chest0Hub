<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Chest0 Hub — Livres, contenus, réseaux sociaux et projets de Chest0 JM.S."
    >

    <meta
        name="theme-color"
        content="#09090d"
    >

    <title>Chest0 Hub — Chest0 JM.S.</title>

    <link
        rel="icon"
        href="assets/icons/chest0-mark.svg"
        type="image/svg+xml"
    >

    <link
        rel="manifest"
        href="manifest.webmanifest"
    >

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >
</head>

<body>

    <header class="hero">
        <div class="hero-content">

            <div class="brand">
                Chest0
            </div>

            <h1 id="site-title">
                Chest0 Hub
            </h1>

            <p
                id="site-tagline"
                class="subtitle"
            >
                Chargement...
            </p>

            <p
                id="site-description"
                class="description"
            >
            </p>

        </div>
    </header>


    <main class="container">

        <section class="section">

            <p class="section-label">
                Découvrir
            </p>

            <h2>
                Mon univers
            </h2>

            <div
                id="primary-links"
                class="link-grid"
            >
            </div>

        </section>


        <section class="section">

            <p class="section-label">
                Créations
            </p>

            <h2>
                Mes projets
            </h2>

            <div
                id="projects-grid"
                class="projects"
            >
            </div>

        </section>

    </main>


    <footer>

        <p>
            ©
            <span id="current-year"></span>
            <span id="copyright-name">
                Chest0 JM.S.
            </span>
        </p>

        <p class="footer-note">
            Chest0 Hub
        </p>

    </footer>


    <script
        src="assets/js/app.js"
        defer
    ></script>

</body>

</html>
